<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Collector mobile QA</title>
<style>body{margin:0;background:#e2e8f0;font:14px system-ui;color:#334155}nav{padding:12px;display:flex;gap:8px;flex-wrap:wrap;justify-content:center;align-items:center}button{padding:8px 12px;border:1px solid #cbd5e1;border-radius:8px;background:white;color:#334155;cursor:pointer}iframe{display:block;border:1px solid #94a3b8;margin:0 auto 20px;border-radius:16px;background:white;max-width:100%}p{text-align:center;margin:10px}</style>
<nav aria-label="Test controls"><strong>Mobile QA · sample data</strong><button onclick="size(320,568)">Small phone</button><button onclick="size(390)">390px</button><button onclick="size(430)">430px</button><button onclick="size(844,390)">Landscape</button><button onclick="size(960)">Desktop</button><button onclick="send('complete-po')">Complete PO</button><button onclick="send('many-tags')">Many tags</button><button onclick="send('fail-tag')">Fail next tag save</button><button onclick="send('offline')">Fail order refresh</button><button onclick="send('online')">Restore connection</button></nav>
<p><output id="metrics">Checking screen fit…</output></p>
<iframe title="Collector mobile preview" src="/tests/collector-fixture.html" width="390" height="844"></iframe>
<script>const frame=document.querySelector('iframe');function size(w,h=844){frame.width=w;frame.height=h}function send(action){frame.contentWindow.postMessage({testAction:action},location.origin)}window.addEventListener('message',e=>{if(e.origin!==location.origin||!e.data.fixtureMetrics)return;const m=e.data.fixtureMetrics;document.querySelector('#metrics').textContent=`${m.width} × ${m.height} · photo ${m.photoHeight}px · action bar ${m.footerHeight}px · ${m.noVerticalScroll?'no vertical scrolling':'SCROLL FAILURE'} · ${m.fullCardFits?'full card fits':'CARD CLIPPED'} · ${m.containedImage?'full image contained':'IMAGE CROPPED'}`})</script>
</html>
